name: "Docker Build"

# merlin-docker is a single Dockerfile that produces ne0nd0g/merlin-base: the base build
# image (Go + MinGW cross-compilers + mimikatz + garble) the agent/agent-dll/mythic DLL
# builds depend on. There is no Go module here, so this is a docker-build workflow rather
# than the Go CI template.
#
# On push/PR/schedule it lints the Dockerfile and validates a multi-arch build WITHOUT
# pushing (no credentials needed). On a version tag it also builds and pushes the image to
# Docker Hub, but only once the DOCKERHUB_USERNAME/DOCKERHUB_TOKEN repo secrets exist; until
# then the push job runs green and skips the push. The scheduled build is an early warning
# for drift in external inputs (the golang base tag, apt packages, and the "latest" mimikatz
# release this image downloads).

on:
  push:
    branches: [ "dev", "main" ]
    tags: [ "v*" ]
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
      - 'CHANGELOG.MD'
  pull_request:
    branches: [ "dev", "main" ]
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
      - 'CHANGELOG.MD'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ne0nd0g/merlin-base
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  hadolint:
    name: Lint Dockerfile (hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build:
    name: Build image (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build both platforms to validate the Dockerfile; push: false discards the result.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: ${{ env.IMAGE }}:ci

  push:
    name: Build and push (tags)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The push is gated on the Docker Hub secrets existing. Until they are added this job
      # runs, finds no token, logs a notice and succeeds without pushing.
      - name: Check for Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_TOKEN secret not set; skipping image push."
          fi

      - name: Set up QEMU
        if: steps.creds.outputs.available == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.creds.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.creds.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
